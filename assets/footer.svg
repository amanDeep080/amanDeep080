<svg width="1400" height="160" viewBox="0 0 1400 160" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5B7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0B4F4A"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#155E63"/>
      <stop offset="100%" stop-color="#0A3438"/>
    </linearGradient>
    <linearGradient id="cubeTopViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cubeLeftViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B1370"/>
    </linearGradient>
    <linearGradient id="cubeRightViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="160" fill="url(#bg)"/>
  
    <g transform="translate(120,40)" filter="url(#softShadow)">
      <polygon points="0,11.0 20.0,0 40,11.0 20.0,22.0" fill="url(#cubeTopViolet)"/>
      <polygon points="0,11.0 20.0,22.0 20.0,44.0 0,33.0" fill="url(#cubeLeftViolet)"/>
      <polygon points="40,11.0 20.0,22.0 20.0,44.0 40,33.0" fill="url(#cubeRightViolet)"/>
    </g>
    
    <g transform="translate(1200,30)" filter="url(#softShadow)">
      <polygon points="0,12.65 23.0,0 46,12.65 23.0,25.3" fill="url(#cubeTop)"/>
      <polygon points="0,12.65 23.0,25.3 23.0,50.6 0,37.95" fill="url(#cubeLeft)"/>
      <polygon points="46,12.65 23.0,25.3 23.0,50.6 46,37.95" fill="url(#cubeRight)"/>
    </g>
    
    <g transform="translate(650,60)" filter="url(#softShadow)">
      <polygon points="0,8.25 15.0,0 30,8.25 15.0,16.5" fill="url(#cubeTop)"/>
      <polygon points="0,8.25 15.0,16.5 15.0,33.0 0,24.75" fill="url(#cubeLeft)"/>
      <polygon points="30,8.25 15.0,16.5 15.0,33.0 30,24.75" fill="url(#cubeRight)"/>
    </g>
    
  <text x="700" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="18" fill="#64748B">Designed with intent &#8212; built to scale.</text>
</svg>